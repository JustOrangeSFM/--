<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Эволюция робототехники | Главная</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,500;6..12,600;6..12,700;6..12,800;6..12,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .hero {
            position: relative;
            background: linear-gradient(135deg, rgba(17, 17, 34, 0.6), rgba(10, 10, 20, 0.8));
            overflow: hidden;
        }
        
        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.85)),
                        url('images/robot-bg.jpg');
            background-size: cover;
            background-position: center 60%; 
            background-repeat: no-repeat;
            filter: blur(8px);
            transform: scale(1.05);
            z-index: 0;
        }
        
        .hero h1,
        .hero p,
        .hero .btn-group {
            position: relative;
            z-index: 2;
        }
        
        @media (max-width: 768px) {
            .hero::before {
                filter: blur(5px);
                background-position: center 55%;
            }
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html">Главная</a></li>
                <li><a href="pages/yesterday.html">История робототехники</a></li>
                <li><a href="pages/today.html">Современные роботы</a></li>
                <li><a href="pages/tomorrow.html">Перспективы робототехники</a></li>
                <li><a href="pages/gallery.html">Галерея</a></li>
            </ul>
            <div class="burger"><span></span><span></span><span></span></div>
        </nav> 
    </header>

    <section class="hero">
        <h1>Эволюция робототехники</h1>
        <p>Путешествие сквозь время: от первых механизмов до искусственного интеллекта</p>
        <div class="btn-group">
            <a href="pages/yesterday.html" class="btn btn-primary">История робототехники</a>
            <a href="pages/today.html" class="btn btn-primary">Современные роботы</a>
            <a href="pages/tomorrow.html" class="btn btn-primary">Перспективы робототехники</a>
        </div>
    </section>
    <script src="js/script.js"></script>
</body>
</html>
